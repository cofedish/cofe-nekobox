name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  go-security:
    name: Go Security (gosec + govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.22"
          cache-dependency-path: |
            go/**/go.sum

      - name: Install scanners
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run gosec for each Go module
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modules < <(find go -name go.mod -type f -print | sed 's#/go.mod$##' | sort -u)
          if [ ${#modules[@]} -eq 0 ]; then
            echo "No Go modules found under go/. Skipping gosec."
            exit 0
          fi

          for mod in "${modules[@]}"; do
            echo "::group::gosec ${mod}"
            (cd "$mod" && gosec ./...) || true
            echo "::endgroup::"
          done

      - name: Run govulncheck for each Go module
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modules < <(find go -name go.mod -type f -print | sed 's#/go.mod$##' | sort -u)
          if [ ${#modules[@]} -eq 0 ]; then
            echo "No Go modules found under go/. Skipping govulncheck."
            exit 0
          fi

          for mod in "${modules[@]}"; do
            echo "::group::govulncheck ${mod}"
            (cd "$mod" && govulncheck ./...)
            echo "::endgroup::"
          done

  codeql-go:
    name: CodeQL Analysis (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-extended
          build-mode: none

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.22"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-go

  codeql-cpp:
    name: CodeQL Analysis (C++)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-extended
          build-mode: manual

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            qtbase5-dev \
            qttools5-dev \
            libqt5svg5-dev

      - name: Build for CodeQL extraction
        run: |
          cmake -S . -B _codeql_build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNKR_NO_GRPC=ON \
            -DNKR_NO_YAML=ON \
            -DNKR_NO_ZXING=ON \
            -DNKR_NO_QHOTKEY=ON
          cmake --build _codeql_build --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-cpp

  trivy-scan:
    name: Trivy Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          scanners: "vuln,secret,misconfig"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
